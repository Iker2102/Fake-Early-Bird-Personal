<!doctype html>

<html lang="es">

<body style="margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#111827;">

  <div style="max-width:720px;margin:0 auto;padding:24px;">

    <div style="background:#ffffff;border:1px solid #e5e7eb;padding:20px;border-radius:10px;">

      <h1 style="margin:0 0 12px;">Resumen diario</h1>

      <p><strong>Fecha:</strong> {{date}}</p>

      <table style="width:100%;border-collapse:collapse;margin-top:16px;">
        <tr>
          <td style="padding:10px;border:1px solid #e5e7eb;">Enviados</td>
          <td style="padding:10px;border:1px solid #e5e7eb;">{{sentCount}}</td>
        </tr>
        <tr>
          <td style="padding:10px;border:1px solid #e5e7eb;">Entregados</td>
          <td style="padding:10px;border:1px solid #e5e7eb;">{{deliveredCount}}</td>
        </tr>
        <tr>
          <td style="padding:10px;border:1px solid #e5e7eb;">Fallidos</td>
          <td style="padding:10px;border:1px solid #e5e7eb;">{{failedCount}}</td>
        </tr>
        <tr>
          <td style="padding:10px;border:1px solid #e5e7eb;">Tasa de éxito</td>
          <td style="padding:10px;border:1px solid #e5e7eb;">{{successRate}}%</td>
        </tr>
      </table>

    </div>

  </div>

</body>

</html>
