<!doctype html>

<html lang="es">

<body style="margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#111827;">

  <div style="max-width:640px;margin:0 auto;padding:24px;">

    <div style="background:#7f1d1d;color:#fff;padding:20px;border-radius:10px;">

      <h1 style="margin:0 0 12px;">Reintentos agotados</h1>

      <p><strong>Contacto:</strong> {{contactName}}</p>
      <p><strong>Teléfono:</strong> {{phone}}</p>
      <p><strong>Reintentos:</strong> {{retryCount}}</p>
      <p><strong>Último error:</strong> {{reason}}</p>
      <p><strong>Mensaje:</strong></p>

      <blockquote style="background:#991b1b;padding:12px;border-radius:8px;">{{messageExcerpt}}</blockquote>

      <p>Se requiere revisión manual desde el dashboard.</p>

    </div>

  </div>

</body>

</html>
