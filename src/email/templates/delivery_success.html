<!doctype html>

<html lang="es">

<body style="margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#111827;">

  <div style="max-width:640px;margin:0 auto;padding:24px;">

    <div style="background:#dcfce7;border-left:6px solid #16a34a;padding:20px;border-radius:10px;">

      <h1 style="margin:0 0 12px;color:#166534;">Mensaje entregado</h1>

      <p><strong>Contacto:</strong> {{contactName}}</p>
      <p><strong>Teléfono:</strong> {{phone}}</p>
      <p><strong>ACK:</strong> {{ackLevel}} - {{ackLabel}}</p>
      <p><strong>Entregado en:</strong> {{deliveredAt}}</p>
      <p><strong>Mensaje:</strong></p>

      <blockquote style="background:#fff;padding:12px;border-radius:8px;">{{messageExcerpt}}</blockquote>

    </div>

  </div>

</body>

</html>
