services:
  fake-early-bird:
    build: .
    container_name: fake-early-bird-dev
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - PUPPETEER_EXECUTABLE_PATH=/home/pptruser/.local/bin/chrome
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
      - wwebjs_auth_dev:/app/.wwebjs_auth
      - wwebjs_cache_dev:/app/.wwebjs_cache
    tmpfs:
      - /tmp
    command: npm run dev:docker
    restart: "no"
    stop_grace_period: 60s

volumes:
  wwebjs_auth_dev:
  wwebjs_cache_dev: